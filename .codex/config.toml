#:schema https://developers.openai.com/codex/config-schema.json

# GPT-5.6 Sol is required for this repository. ChatGPT-authenticated Codex
# currently caps it at 272k even though the API model supports a 1.05M window.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"

sandbox_mode = "danger-full-access"

[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "max"
interrupt_message = true

[agents.implementer]
description = "Implement, maintain, or refactor one scoped vorton-lang item in a root-assigned worktree; route blockers to root and keep the same identity through review and fixes."
config_file = "agents/implementer.toml"

[agents.reviewer]
description = "Read-only review of vorton-lang implementation, maintenance, refactor, risk, or Argument evidence against specs and invariants."
config_file = "agents/reviewer.toml"

[agents.finder]
description = "Read-only vorton-lang risk-audit or Argument evidence finder assigned explicit lenses on a fixed main snapshot."
config_file = "agents/finder.toml"

[agents.skeptic]
description = "Read-only adversarial verifier for audit findings, risk claims, and Argument candidates."
config_file = "agents/skeptic.toml"
