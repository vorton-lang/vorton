name: Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate current tree
        run: python .agents/scripts/validate_current_tree.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint compiler
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test compiler
        run: cargo test --workspace --locked
      - name: Check whitespace errors
        run: git diff --check
